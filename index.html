<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cursor Persist (v0.3.0)</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    #status {
      font: 11px/1.3 system-ui, sans-serif; color: #888;
      padding: 4px 6px; white-space: nowrap; overflow: hidden;
    }
    body.silent #status { display: none; }
  </style>
</head>
<body class="silent">
  <!--
    Cursor Persist v0.3.0 — two-widget topology

    Grist's Select By is one-directional. A widget that follows the master
    via Select By cannot also broadcast a cursor back to the master without
    Grist rejecting the call as a cycle. So v0.3.0 splits the responsibility
    into two roles, selected via URL query parameter:

      ?role=listener   — Select By → master. Saves master's cursor to
                         localStorage on every change. Does NOT broadcast.
      ?role=driver     — No Select By. On mount, reads localStorage and
                         broadcasts via setSelectedRows. Master Select By
                         → this widget so the broadcast lands.
      (no role / ?role=both)
                       — Legacy v0.2.x behavior: saves AND tries to restore
                         via setSelectedRows. The restore fails on any setup
                         where this widget follows master (LinkConfig cycle).
                         Kept for backwards compatibility; not recommended.

    Setup, per page where you want persistence:
      1. Add Custom Widget #1 with URL `.../grist-cursor-persist/?role=listener`,
         bind to your master table (Events), set Select By → the master grid.
      2. Add Custom Widget #2 with URL `.../grist-cursor-persist/?role=driver`,
         bind to the same master table (Events). NO Select By on this one.
      3. On the master grid: set Select By → widget #2 (the driver) so the
         broadcast on page load actually moves the master cursor.
      4. Append `&debug=1` to both URLs while verifying. Drop it once happy.
      5. Repeat per page. State is shared via localStorage keyed by
         (docName, tableId), so it survives page switches, tab refreshes,
         and tab close/reopen for that browser.
  -->

  <div id="status">cursor-persist initializing…</div>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script>
    const VERSION = '0.3.0';
    const KEY_PREFIX = 'persist_cursor';

    const params = new URLSearchParams(location.search);
    if (params.get('debug') === '1') document.body.classList.remove('silent');

    // Role: 'listener' (save-only), 'driver' (restore-only), or 'both' (legacy).
    const ROLE = (params.get('role') || 'both').toLowerCase();
    const VALID_ROLES = new Set(['listener', 'driver', 'both']);
    const role = VALID_ROLES.has(ROLE) ? ROLE : 'both';

    const statusEl = document.getElementById('status');
    const setStatus = (msg) => {
      statusEl.textContent = `[cursor-persist v${VERSION} ${role}] ${msg}`;
    };

    // Discover the docId via grist.docApi.getDocName() (stable per-doc string),
    // with URL-query and referrer fallbacks for older SDKs.
    async function discoverDocId() {
      try {
        if (grist.docApi && typeof grist.docApi.getDocName === 'function') {
          const name = await grist.docApi.getDocName();
          if (name) return name;
        }
      } catch (_) { /* fall through */ }
      const p = new URLSearchParams(location.search).get('gristDocId');
      if (p) return p;
      const ref = document.referrer || '';
      try {
        const u = new URL(ref);
        const seg = u.pathname.split('/').filter(Boolean)[0];
        if (seg) return seg;
      } catch (_) { /* fall through */ }
      return 'unknown';
    }

    let docId = 'unknown';
    let tableId = null;
    let storageKey = null;
    let restored = false;
    let lastSavedId = null;

    function buildKey() {
      return `${KEY_PREFIX}::${docId}::${tableId || 'unknown'}`;
    }

    async function discoverTableId() {
      try {
        if (grist.selectedTable && typeof grist.selectedTable.getTableId === 'function') {
          const id = await grist.selectedTable.getTableId();
          if (id) return id;
        }
      } catch (_) { /* fall through */ }
      try {
        const t = await grist.getTable();
        if (t && t.tableId) return t.tableId;
      } catch (_) { /* fall through */ }
      return null;
    }

    async function restoreSelection() {
      const raw = localStorage.getItem(storageKey);
      if (raw == null) {
        setStatus(`no stored cursor for ${tableId || 'unbound'}; idle`);
        return;
      }
      const rowId = Number(raw);
      if (!Number.isFinite(rowId) || rowId <= 0) {
        setStatus(`stored value not a row id: ${raw}; idle`);
        return;
      }
      const payload = tableId ? { tableId, rowIds: [rowId] } : [rowId];
      try {
        await grist.setSelectedRows(payload);
        lastSavedId = rowId;
        setStatus(`broadcast ${tableId || 'table'} row ${rowId}`);
        console.log('[cursor-persist] broadcast', tableId, rowId);
      } catch (err) {
        // In `both` mode this is the expected LinkConfig cycle error.
        setStatus(`broadcast failed: ${err && err.message || err}`);
        console.warn('[cursor-persist] broadcast failed:', err);
      }
    }

    grist.ready({
      requiredAccess: 'full',
      // `driver` role doesn't need to broadcast through allowSelectBy from
      // Grist's perspective — the master section follows us via its own
      // Select By config — but declaring allowSelectBy: true here makes the
      // widget appear in the master's "Select By" dropdown in the Grist UI,
      // which the user needs to be able to wire the topology.
      allowSelectBy: true
    });

    grist.onRecord(record => {
      if (!restored) return;
      if (role === 'driver') return;     // driver never saves
      if (!record || record.id == null) return;
      const id = Number(record.id);
      if (!Number.isFinite(id) || id <= 0) return;
      if (id === lastSavedId) return;
      try {
        localStorage.setItem(storageKey, String(id));
        lastSavedId = id;
        console.log('[cursor-persist] saved', tableId, id);
        setStatus(`saved ${tableId || 'table'} row ${id}`);
      } catch (err) {
        console.warn('[cursor-persist] save failed:', err);
        setStatus(`save failed: ${err && err.message || err}`);
      }
    });

    (async () => {
      try {
        [docId, tableId] = await Promise.all([discoverDocId(), discoverTableId()]);
        storageKey = buildKey();
        setStatus(`ready (doc=${docId}, table=${tableId || 'unbound'})`);
        // Listener role skips restore. Driver and `both` attempt it.
        if (role !== 'listener') {
          await restoreSelection();
        }
      } catch (err) {
        console.warn('[cursor-persist] bootstrap failed:', err);
        setStatus(`bootstrap failed: ${err && err.message || err}`);
      } finally {
        restored = true;
      }
    })();
  </script>
</body>
</html>
