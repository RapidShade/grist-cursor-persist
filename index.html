<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Cursor Persist (v1.4.0)</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      font-family: system-ui, -apple-system, sans-serif;
      color: #444;
    }
    #panel { padding: 6px 8px; font-size: 11px; line-height: 1.45; }
    #panel select { font-size: 11px; vertical-align: middle; }
    #role-help { color: #888; display: block; margin-top: 2px; }
    #status { color: #888; margin-top: 4px; white-space: nowrap; overflow: hidden; }
    body.silent #status { display: none; }
  </style>
</head>
<body class="silent">
  <!--
    Cursor Persist v1.4.0 — commandApi.run("setCursor", …) probe.

    v1.3.0's filter-then-null left the linked card in a broken
    zero-row state. setSelectedRows-based approaches are now
    conclusively closed off. v1.4.0 tries the last untested SDK path:
    grist.commandApi.run() forwards arbitrary command names to
    Grist's internal command bus, and the command list has a
    `setCursor` command. Argument signature is undocumented — this
    version probes multiple shapes per master section and logs which
    one (if any) moves the cursor.

    Wiring vs v1.3.0: remove `Select By → driver` again (we're not
    using setSelectedRows at all — no side effects on the detail card).
    With v1.4.0 the detail page can stay completely untouched; the
    driver is read-only in its effect.

    Role is selectable from the dropdown below; the choice is persisted
    per-section via Grist's widget options API. URL `?role=` overrides
    (and disables) the dropdown for the duration of that section's life.

    Roles:
      listener (default): Select By → your master. Saves cursor changes.
      driver:             No Select By. Master Select By → this widget.
                          Broadcasts the stored row id on mount.
      both:               Legacy combined mode. May trigger a LinkConfig
                          cycle error if this widget has Select By → master.

    Setup, per page:
      1. Add Custom Widget #1 — bind to Events, role=listener, Select By → master.
      2. Add Custom Widget #2 — bind to Events, role=driver, no Select By.
      3. On the master grid: set Select By → widget #2.
      4. Add `?debug=1` to either URL while verifying.
  -->

  <div id="panel">
    <label>
      Role:
      <select id="role-select">
        <option value="listener">listener — save cursor</option>
        <option value="driver">driver — restore cursor</option>
        <option value="both">both (legacy)</option>
      </select>
    </label>
    <span id="role-help"></span>
    <div id="status">cursor-persist initializing…</div>
  </div>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script>
    const VERSION = '1.4.0';
    const VLOG_PREFIX = `[cursor-persist v${VERSION}]`;
    const KEY_PREFIX = 'persist_cursor';

    // Versioned console wrappers so every log line carries the build version.
    const vlog  = (...a) => console.log(VLOG_PREFIX, ...a);
    const vwarn = (...a) => console.warn(VLOG_PREFIX, ...a);
    const verr  = (...a) => console.error(VLOG_PREFIX, ...a);

    // Loud, hard-to-miss load banner. Uses raw console.log so the %c
    // styling renders without an extra prefix shifted in front of it.
    console.log(
      `%c${VLOG_PREFIX}%c loaded — ${new Date().toLocaleTimeString()}`,
      'background:#0066cc;color:#fff;font-weight:bold;padding:2px 6px;border-radius:3px;',
      'color:#0066cc;font-weight:bold;'
    );

    const VALID_ROLES = ['listener', 'driver', 'both'];
    const DEFAULT_ROLE = 'listener';
    const ROLE_HELP = {
      listener: 'Wiring: this widget\'s Select By → your master grid.',
      driver:   'Wiring: nothing (no Select By needed). Probes commandApi.run("setCursor", …) per discovered master section.',
      both:     'Combines listener + driver. Set Select By → master on this widget. No Select By on the masters.'
    };

    const params = new URLSearchParams(location.search);
    if (params.get('debug') === '1') document.body.classList.remove('silent');

    const statusEl = document.getElementById('status');
    const roleSelectEl = document.getElementById('role-select');
    const roleHelpEl = document.getElementById('role-help');

    let role = DEFAULT_ROLE;
    const setStatus = (msg) => {
      statusEl.textContent = `[v${VERSION} ${role}] ${msg}`;
    };
    const updateHelp = (r) => { roleHelpEl.textContent = ROLE_HELP[r] || ''; };

    // URL `?role=…` is an override that disables the dropdown.
    const urlRoleRaw = (params.get('role') || '').toLowerCase();
    const isUrlOverride = VALID_ROLES.includes(urlRoleRaw);

    async function loadRole() {
      if (isUrlOverride) {
        roleSelectEl.disabled = true;
        roleSelectEl.value = urlRoleRaw;
        roleSelectEl.title = 'role is set via URL query param; remove ?role= to use this dropdown';
        updateHelp(urlRoleRaw);
        return urlRoleRaw;
      }
      try {
        if (grist.widgetApi && typeof grist.widgetApi.getOptions === 'function') {
          const opts = await grist.widgetApi.getOptions();
          if (opts && opts.role && VALID_ROLES.includes(opts.role)) {
            roleSelectEl.value = opts.role;
            updateHelp(opts.role);
            return opts.role;
          }
        }
      } catch (err) {
        vwarn('getOptions failed:', err);
      }
      roleSelectEl.value = DEFAULT_ROLE;
      updateHelp(DEFAULT_ROLE);
      return DEFAULT_ROLE;
    }

    roleSelectEl.addEventListener('change', async (e) => {
      const newRole = e.target.value;
      if (!VALID_ROLES.includes(newRole)) return;
      updateHelp(newRole);
      try {
        await grist.widgetApi.setOptions({ role: newRole });
        setStatus(`role saved as "${newRole}"; reloading…`);
        setTimeout(() => location.reload(), 400);
      } catch (err) {
        setStatus(`save failed: ${err && err.message || err}`);
      }
    });

    async function discoverDocId() {
      try {
        if (grist.docApi && typeof grist.docApi.getDocName === 'function') {
          const name = await grist.docApi.getDocName();
          if (name) return name;
        }
      } catch (_) {}
      const p = params.get('gristDocId');
      if (p) return p;
      try {
        const u = new URL(document.referrer || '');
        const seg = u.pathname.split('/').filter(Boolean)[0];
        if (seg) return seg;
      } catch (_) {}
      return 'unknown';
    }

    async function discoverTableId() {
      try {
        if (grist.selectedTable && typeof grist.selectedTable.getTableId === 'function') {
          const id = await grist.selectedTable.getTableId();
          if (id) return id;
        }
      } catch (_) {}
      try {
        const t = await grist.getTable();
        if (t && t.tableId) return t.tableId;
      } catch (_) {}
      return null;
    }

    let docId = 'unknown';
    let tableId = null;
    let storageKey = null;
    let restored = false;
    let lastSavedId = null;

    function buildKey() {
      return `${KEY_PREFIX}::${docId}::${tableId || 'unknown'}`;
    }

    // Discover non-Custom-Widget sections viewing our bound table.
    async function discoverMasterSectionIds() {
      if (!tableId) return [];
      const tables = await grist.docApi.fetchTable('_grist_Tables');
      const tableIdxs = (tables.tableId || []).map((t, i) => t === tableId ? i : -1).filter(i => i >= 0);
      if (tableIdxs.length === 0) return [];
      const tableRefs = new Set(tableIdxs.map(i => tables.id[i]));
      const secs = await grist.docApi.fetchTable('_grist_Views_section');
      const ids = secs.id || [];
      const tableRef = secs.tableRef || [];
      const parentKey = secs.parentKey || [];
      const masters = [];
      for (let i = 0; i < ids.length; i++) {
        if (tableRefs.has(tableRef[i]) && parentKey[i] !== 'custom') masters.push(ids[i]);
      }
      return masters;
    }

    async function restoreSelection() {
      const raw = localStorage.getItem(storageKey);
      if (raw == null) {
        setStatus(`no stored cursor for ${tableId || 'unbound'}; idle`);
        return;
      }
      const rowId = Number(raw);
      if (!Number.isFinite(rowId) || rowId <= 0) {
        setStatus(`stored value not a row id: ${raw}; idle`);
        return;
      }
      lastSavedId = rowId;

      const sectionIds = await discoverMasterSectionIds();
      if (sectionIds.length === 0) {
        setStatus(`no master sections found for ${tableId}`);
        vwarn('no master sections found');
        return;
      }

      // Probe commandApi.run("setCursor", ...) with several argument
      // shapes per section. Grist's commandApi is `rpc.getStub<any>` —
      // untyped; the host forwards command names to the internal bus.
      // Whether the bus accepts arbitrary commands from widgets, and
      // what signature setCursor wants, is what we're testing.
      const probe = async (label, fn) => {
        try {
          const result = await fn();
          vlog(`probe OK: ${label}`, result === undefined ? '' : `=> ${JSON.stringify(result)}`);
          return { ok: true };
        } catch (err) {
          vwarn(`probe FAIL: ${label} —`, err && err.message || err);
          return { ok: false, err };
        }
      };

      vlog('rowId=', rowId, 'sectionIds=', sectionIds);

      // Probe 1: object form with rowId + sectionId — most likely shape.
      // Use first section only so we don't fire dozens of commands
      // and have no idea which one (if any) moved the cursor.
      const sid = sectionIds[0];
      setStatus(`probing commandApi.run("setCursor", ...) — section ${sid}, row ${rowId}`);

      await probe(
        `setCursor({rowId:${rowId}, sectionId:${sid}})`,
        () => grist.commandApi.run('setCursor', { rowId, sectionId: sid })
      );

      await new Promise(r => setTimeout(r, 100));

      await probe(
        `setCursor(${rowId}, ${sid}) [positional]`,
        () => grist.commandApi.run('setCursor', rowId, sid)
      );

      setStatus(`probed setCursor on section ${sid}, row ${rowId} — check console + UI`);
    }

    grist.ready({
      requiredAccess: 'full',
      allowSelectBy: true
    });

    grist.onRecord(record => {
      if (!restored) return;
      if (role === 'driver') return;
      if (!record || record.id == null) return;
      const id = Number(record.id);
      if (!Number.isFinite(id) || id <= 0) return;
      if (id === lastSavedId) return;
      try {
        localStorage.setItem(storageKey, String(id));
        lastSavedId = id;
        vlog('saved', tableId, id);
        setStatus(`saved ${tableId || 'table'} row ${id}`);
      } catch (err) {
        vwarn('save failed:', err);
        setStatus(`save failed: ${err && err.message || err}`);
      }
    });

    (async () => {
      try {
        role = await loadRole();
        [docId, tableId] = await Promise.all([discoverDocId(), discoverTableId()]);
        storageKey = buildKey();
        setStatus(`ready (doc=${docId}, table=${tableId || 'unbound'})`);
        if (role !== 'listener') {
          await restoreSelection();
        }
      } catch (err) {
        vwarn('bootstrap failed:', err);
        setStatus(`bootstrap failed: ${err && err.message || err}`);
      } finally {
        restored = true;
      }
    })();
  </script>
</body>
</html>
